<div class="row" *ngIf="data.length; else loading">
    <div class="col-md-3 col-sm-6" *ngFor="let item of data">
        <div class="product-grid">
            <div class="product-image">
                <a href="#" class="image">
                    <img class="pic-1" [src]="'http://localhost:3000/' + item.imageUrl">
                    <img class="pic-2" [src]="'http://localhost:3000/' + item.imageUrl">
                    <!-- <img class="pic-2" src="images/img-2.jpg"> -->
                </a>
                <a href="#" class="product-like-icon" data-tip="Add to Wishlist">
                    <i class="fa fa-heart"></i>
                </a>
                <ul class="product-links">
                    <li><a href="#"><i class="fa fa-search"></i></a></li>
                    <li><a href="#"><i class="fas fa-shopping-cart"></i></a></li>
                    <li><a href="#"><i class="fa fa-random"></i></a></li>
                </ul>
            </div>
            <div class="product-content">
                <h3 class="title"><a href="#">{{ item.name }}</a></h3>
                <div class="price">${{item.price}}</div>
            </div>
        </div>
    </div>
